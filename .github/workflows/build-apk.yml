name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Runner ubuntu-latest sudah punya Android SDK. Action setup-android@v3 gagal ("Failed to find package 'tools'"),
      # jadi cukup terima lisensi dan pasang platform yang dibutuhkan Capacitor 7.
      - name: Siapkan Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Cek secret wajib
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 belum diisi (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ -n "$KS" ]; then
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "Keystore ditemukan: build RELEASE yang ditandatangani"
          else
            echo "Keystore tidak ada: build DEBUG (tetap bisa dipasang di HP)"
          fi

      - name: Install dependency
        run: npm install --no-audit --no-fund

      - name: Siapkan folder www (path halaman + layar offline)
        run: python3 scripts/prepare-www.py

      - name: Buat proyek Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Pasang google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GSJ" | base64 -d > android/app/google-services.json
          grep -q '"package_name": "com.circlemedia.nyr.app"' android/app/google-services.json || { echo "::error::package_name di google-services.json harus com.circlemedia.nyr.app"; exit 1; }

      - name: Patch Android (izin, service, boot receiver, ikon, versi)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          pip install pillow
          python3 scripts/patch-android.py

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Tandatangani release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          echo "$KS_B64" | base64 -d > release.jks
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk dist/aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out dist/COA-release.apk dist/aligned.apk
          "$BT/apksigner" verify dist/COA-release.apk
          rm -f dist/aligned.apk release.jks

      - name: Ambil debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/COA-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: COA-apk
          path: mobile/dist/*.apk
          if-no-files-found: error